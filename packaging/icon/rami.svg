<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="RAMI-Chain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2e"/>
      <stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#7ef0c0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab6ff"/>
      <stop offset="1" stop-color="#7ef0c0"/>
    </linearGradient>
  </defs>

  <!-- fondo redondeado -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#2a3552" stroke-width="3"/>

  <!-- árbol ramificado: un padre que se bifurca en ramas hermanas -->
  <g fill="none" stroke="url(#edge)" stroke-width="16" stroke-linecap="round">
    <path d="M256 150 L256 232"/>
    <path d="M256 232 L168 320"/>
    <path d="M256 232 L344 320"/>
    <path d="M344 320 L300 392"/>
    <path d="M344 320 L392 392"/>
  </g>

  <!-- bloques (nodos) -->
  <g fill="url(#node)" stroke="#0a0e18" stroke-width="6">
    <rect x="214" y="104" width="84" height="70" rx="16"/>
    <rect x="126" y="286" width="84" height="70" rx="16"/>
    <rect x="258" y="360" width="84" height="70" rx="16"/>
    <rect x="350" y="360" width="84" height="70" rx="16"/>
  </g>
  <!-- nodo de bifurcación -->
  <circle cx="256" cy="232" r="26" fill="#7ef0c0" stroke="#0a0e18" stroke-width="6"/>
</svg>
