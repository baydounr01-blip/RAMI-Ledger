# Construye binarios reproducibles del nodo y el monedero de RAMI-Chain para
# Linux/macOS/Windows y los publica como Release de GitHub con SHA256SUMS.
# Se dispara al empujar una etiqueta v* (p. ej. v0.1.0) o a mano.
#
# RECORDATORIO: RAMI-Chain es una red de PRUEBAS experimental. Su moneda no tiene
# valor monetario, no es una inversión ni un valor negociable. Estos binarios no
# van firmados con code-signing de plataforma: verifícalos con SHA256SUMS.txt.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a construir (p. ej. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, archive: tar.gz }
          # macOS Intel se compila cruzado desde el runner arm64 (los runners
          # macos-13 están retirados y el job se quedaría en cola para siempre).
          - { os: macos-latest,   target: x86_64-apple-darwin,      archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,     archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip }
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compilar (--locked, reproducible)
        run: >
          cargo build --release --locked
          --manifest-path chain/Cargo.toml
          --target ${{ matrix.target }}
          -p rami-node -p rami-wallet -p rami-gui

      - name: Empaquetar (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="rami-chain-${TAG}-${{ matrix.target }}"
          OUT="chain/target/${{ matrix.target }}/release"
          mkdir -p "dist/$NAME"
          cp "$OUT/rami-node" "$OUT/rami-wallet" "$OUT/rami-gui" "dist/$NAME/"
          cp README.md NOTICE.md LICENSE "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"

      - name: Empaquetar (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="rami-chain-${TAG}-${{ matrix.target }}"
          OUT="chain/target/${{ matrix.target }}/release"
          mkdir -p "dist/$NAME"
          cp "$OUT/rami-node.exe" "$OUT/rami-wallet.exe" "$OUT/rami-gui.exe" "dist/$NAME/"
          cp README.md NOTICE.md LICENSE "dist/$NAME/" 2>/dev/null || true
          ( cd dist && 7z a "$NAME.zip" "$NAME" >/dev/null )

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reunir binarios y checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          ( cd out && sha256sum * > SHA256SUMS.txt )
          echo "== SHA256SUMS.txt ==" && cat out/SHA256SUMS.txt

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES=$'Binarios de la testnet **EXPERIMENTAL** de RAMI-Chain: nodo (`rami-node`), monedero CLI (`rami-wallet`) y **monedero de escritorio** (`rami-gui`).\n\n- Moneda **sin valor monetario**; no es una inversión ni un valor negociable; **no se vende**.\n- Se obtienen monedas gratis **minando** (un clic en el monedero de escritorio) o con **staking**. **Sin premine.**\n- Verifica tu descarga con `SHA256SUMS.txt` antes de ejecutar. Lee `NOTICE.md`.'
          gh release create "$TAG" out/* \
            --title "RAMI-Chain $TAG" \
            --notes "$NOTES" \
          || gh release upload "$TAG" out/* --clobber
