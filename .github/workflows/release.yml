# Construye instaladores de UN SOLO archivo con icono para cada plataforma
# (AppImage / .dmg / instalador .exe), los firma/notariza si hay certificados en
# los secrets (ver SIGNING.md) y publica un Release de GitHub con SHA256SUMS.
# Dispara al empujar una etiqueta v* o a mano (workflow_dispatch).
#
# RAMI-Chain es una testnet EXPERIMENTAL: la moneda no tiene valor monetario, no
# es inversión ni valor negociable. Sin certificados, los binarios NO van
# firmados: verifícalos con SHA256SUMS.txt.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a construir (p. ej. v0.2.1)'
        required: true

permissions:
  contents: write

jobs:
  icons:
    name: iconos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas de icono
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Rasterizar SVG -> ico/iconset/png
        run: bash packaging/make-icons.sh
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: packaging/out

  build:
    name: build ${{ matrix.target }}
    needs: icons
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, kind: linux,   arch: x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,     kind: macos,   arch: arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      kind: macos,   arch: x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   kind: windows, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Recuperar iconos
        uses: actions/download-artifact@v4
        with:
          name: icons
          path: packaging/out

      - name: NSIS (solo Windows)
        if: matrix.kind == 'windows'
        run: choco install nsis -y --no-progress

      - name: Compilar (--locked, reproducible)
        env:
          # Windows: CRT estático — sin esto, un PC sin el runtime de Visual
          # C++ instalado no puede ni arrancar el binario (fallo silencioso).
          RUSTFLAGS: ${{ matrix.kind == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: >
          cargo build --release --locked
          --manifest-path chain/Cargo.toml
          --target ${{ matrix.target }}
          -p rami-node -p rami-wallet -p rami-gui

      - name: Empaquetar (un archivo con icono; firma si hay certificado)
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          # Firma macOS (opcional) — ver SIGNING.md
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # Firma Windows (opcional) — ver SIGNING.md
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: bash packaging/package.sh "${{ matrix.kind }}" "${{ matrix.target }}" "${{ matrix.arch }}"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*

  publish:
    name: publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reunir binarios y checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          ( cd out && sha256sum * > SHA256SUMS.txt )
          echo "== SHA256SUMS.txt ==" && cat out/SHA256SUMS.txt

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES=$'Instaladores de la testnet **EXPERIMENTAL** de RAMI-Chain — un archivo por sistema, con icono:\n\n- **macOS:** `.dmg` · **Windows:** instalador `.exe` · **Linux:** `.AppImage`.\n- Moneda **sin valor monetario**; no es inversión ni valor negociable; **no se vende**. Se obtiene minando o con staking. **Sin premine.**\n- **Firma:** si el repo tiene certificados (ver `SIGNING.md`), las descargas van firmadas y notarizadas; si no, van **sin firmar** — verifícalas con `SHA256SUMS.txt` y ábrelas siguiendo las notas de la web.\n- Para avanzados: también hay `.tar.gz`/`.zip` con los binarios sueltos.'
          gh release create "$TAG" out/* \
            --title "RAMI-Chain $TAG" \
            --notes "$NOTES" \
          || gh release upload "$TAG" out/* --clobber

      # Tras publicar, reconstruye la web (quantbot.army) para que sus descargas
      # y su espejo latest.json sirvan YA la versión nueva. Opcional: requiere
      # el secret NETLIFY_BUILD_HOOK (Netlify → Site settings → Build hooks).
      - name: Reconstruir la web (Netlify build hook)
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" >/dev/null && echo "✓ web en reconstrucción"
          else
            echo "(sin NETLIFY_BUILD_HOOK: reconstruye la web a mano en Netlify para servir esta versión)"
          fi
