[workspace]
resolver = "2"
members = ["crates/rami-core", "crates/rami-net", "crates/rami-node", "crates/rami-wallet", "crates/rami-gui"]

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT"
authors = ["Rami Baydoun Nabhan"]

[workspace.dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
# Cifrado del keystore (v0.4): KDF y AEAD auditados de RustCrypto — nunca
# criptografía casera para guardar claves.
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
# Cliente HTTPS para el auto-actualizador (TLS con rustls, sin OpenSSL del
# sistema). `native-certs`: confía en el almacén de certificados del SISTEMA
# (como el navegador) — con las raíces empaquetadas, cualquier red corporativa
# o antivirus que inspeccione TLS rompía la comprobación de actualizaciones
# aunque el navegador funcionara. La integridad de la descarga sigue anclada al
# SHA-256 publicado en el release.
ureq = { version = "2", features = ["native-certs"] }

[profile.release]
opt-level = 3
lto = true
